<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yin Yang Hero</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #0a1628;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Georgia, serif;
}
.hero {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 48px 20px 40px;
}
.yy-wrap {
  position: relative;
  width: 500px;
  height: 500px;
}

/* Every state layer stacks at same position, all start invisible */
.layer {
  position: absolute;
  inset: 0;
  opacity: 0;
  transition: opacity 1.4s ease-in-out;
  /* Ensure each layer is fully self-contained — nothing bleeds through */
  isolation: isolate;
}
.layer.active { opacity: 1; }

/* Gold outline sits above ALL layers always */
.outline {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 100;
}

/* Clipping containers inside each layer */
.yy-clip {
  position: absolute;
  inset: 0;
  width: 500px;
  height: 500px;
  overflow: hidden;
}
.clip-dark        { clip-path: path('M250,4 A246,246 0 0,1 250,496 A123,123 0 0,1 250,250 A123,123 0 0,0 250,4Z'); }
.clip-light       { clip-path: path('M250,4 A246,246 0 0,0 250,496 A123,123 0 0,0 250,250 A123,123 0 0,1 250,4Z'); }
.clip-dot-top     { clip-path: circle(33px at 250px 127px); }
.clip-dot-bottom  { clip-path: circle(33px at 250px 373px); }

.yy-clip img {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* Per-image positioning — shift subjects into their visible zone */
.img-hcmc { object-position: 20% center; }
.img-cam  { object-position: 60% center; }
.img-biz  { object-position: 35% 15%; }
.img-dev  { object-position: 65% 30%; }

/* Captions & UI */
.caption-row {
  display: flex;
  justify-content: space-between;
  width: 500px;
  margin-top: 20px;
  padding: 0 12px;
}
.cap {
  font-size: 11px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: #c9a84c;
  width: 48%;
  opacity: 0;
  transition: opacity 0.8s ease;
}
.cap.show { opacity: 1; }
.cap.right { text-align: right; }
.tagline {
  font-size: 12px;
  letter-spacing: 0.26em;
  text-transform: uppercase;
  color: #c9a84c;
  opacity: 0.45;
  margin-top: 22px;
}
.dots { display: flex; gap: 12px; margin-top: 18px; }
.dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: #c9a84c;
  opacity: 0.28;
  cursor: pointer;
  border: none;
  transition: opacity 0.3s;
}
.dot.on { opacity: 1; }
</style>
</head>

<script>
const states = [
  { layer:'l0', L:'tradition',           R:'harmony' },
  { layer:'l1', L:'modern Asia · HCMC', R:'classical West · Cambridge' },
  { layer:'l2', L:'yin',                R:'yang' },
  { layer:'l3', L:'business mindset',   R:'technology mindset' }
];
let cur = 0, tmr;

function go(i) {
  clearTimeout(tmr);
  document.getElementById(states[cur].layer).classList.remove('active');
  document.getElementById('d' + cur).classList.remove('on');
  cur = i;
  document.getElementById(states[cur].layer).classList.add('active');
  document.getElementById('d' + cur).classList.add('on');
  const cL = document.getElementById('cL');
  const cR = document.getElementById('cR');
  cL.classList.remove('show'); cR.classList.remove('show');
  setTimeout(() => {
    cL.textContent = states[cur].L;
    cR.textContent = states[cur].R;
    cL.classList.add('show');
    cR.classList.add('show');
  }, 400);
  tmr = setTimeout(() => go((cur + 1) % 4), 3000);
}
go(0);
</script>
